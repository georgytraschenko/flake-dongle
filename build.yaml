name: Compile ZMK
on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"
      - "config/*.dtsi"
      - "config/*.conf"
      - "config/west.yml"
      - "config/boards/shields/*/*.conf"
      - "config/boards/shields/*/*.overlay"
      - "config/boards/*/*/*.keymap"

jobs:
  build:
    # запинено вместе с west.yml: workflow и ZMK должны быть одной версии
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
